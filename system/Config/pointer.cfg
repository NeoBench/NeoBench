# NeoBench pointer preferences.
#
# Read from Config/pointer.cfg inside the ROM image every time NeoBench
# reaches the desktop.  Nothing here needs AmigaOS: the store is NeoBench's
# own (tools/mkpfs.py packs system/ into the ROM).
#
# shape    arrow | cross | ibeam | dot
# scale    1 = native, 2 = double size
# speed    pointer travel per mouse count, 1..8
# colour   fill colour, #RRGGBB -- picked out of the running palette
# shadow   dark drop shadow behind the arrow (on/off)
# visible  show the pointer at all (on/off)
# start    where it parks until the mouse moves, x,y in screen pixels

shape   = arrow
scale   = 1
speed   = 2
colour  = #F4FAFF
shadow  = on
visible = on
start   = 320,256
