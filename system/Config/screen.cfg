# NeoBench screen preferences.
#
# Read from Config/screen.cfg inside the ROM image before the desktop is
# composited.  The raster mode itself is fixed by the ROM (AGA hires,
# 640x512 interlaced, eight bitplanes) -- these are the parts of the
# desktop that are meant to be edited without rebuilding NeoBench.
#
# mode     hires-lace | hires
# width    raster width in pixels      (informational, must be 640)
# height   raster height in pixels     (informational, must be 512)
# depth    bits per pixel              (informational, must be 8)
# bg_top   wallpaper gradient top,    #RRGGBB
# bg_bot   wallpaper gradient bottom, #RRGGBB
# backdrop which of the five backdrops the desktop paints:
#          wash    (the NeoBench wash -- the two colours above)
#          paper   (warm cream)
#          azure   (pale sky)
#          dusk    (peach falling to lilac)
#          slate   (cool grey-blue)
# grid     hairline grid over the wallpaper (on/off)
# glow     horizon glows               (on/off)
# taskbar  draw the taskbar            (on/off)
# bar      taskbar style: aero (the glass the desktop draws by
#          default) | classic (the flat Workbench field)
# glass    how much of the backdrop the Aero bar shows through,
#          0 .. 100; 0 is painted solid, 100 is nearly not there
# font     text face: Xen (the standard, nine pixels) | Xen11 (the
#          same face, eleven pixels) | System (8x8)
#
# The backdrop itself is NeoBench's own: white falling to mint, with
# the three horizon glows, the hairline grid, the mark and the
# wordmark laid over it in that order.  The wash is what these two
# gradient colours carry; backdrop picks which of the five the wash is
# painted with (Preferences shows the same five and changes it at once,
# but only this file decides what the machine comes up with); grid and
# glow each switch their own layer without rebuilding NeoBench.
#
# Xen is the face NeoBench sets type in everywhere: eight pixels of
# advance, nine rows, one pixel strokes, cut from the Amiga font of the
# same name rather than drawn by hand.  System is the older eight pixel
# console face, kept for comparison.  Xen11 is that same face cut at
# eleven rows from the font of that name: the same eight pixel cell and
# the same one pixel strokes, so strw() measures it the way it measures
# Xen and the desktop is laid out the same, only two pixels more to
# each line.  Whichever is here is the face every window, menu, icon
# label and page of the reader sets its type in.

mode    = hires-lace
width   = 640
height  = 512
depth   = 8
bg_top  = #FFFFFF
bg_bot  = #DCEFE6
backdrop = wash
grid    = on
glow    = on
taskbar = on
bar     = aero
glass   = 20
font    = Xen
