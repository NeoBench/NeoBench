# NeoBench sound preferences
#
# startup  play the startup chime when NeoBench comes up
# volume   Paula output level, 0 (silent) .. 64 (loudest)
# file     the chime, as a path inside NeoBench's own file store
#
# Malformed values keep their default, so this file can be edited
# without a tool and cannot stop the machine booting.

startup = on
volume  = 48
file    = Core/Media/startup.snd
