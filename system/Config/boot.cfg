# NeoBench boot preferences.
#
# Read from Config/boot.cfg inside the ROM image before the desktop is
# composited.  These are the two things about the boot that are worth
# changing without rebuilding NeoBench: how long the log stays on the
# screen after the chime, and whether the machine walks its hardware
# before it binds drivers to it.
#
# hold     seconds the boot log is held after the chime, 0 .. 15
#          (and the window in which Esc calls up NeoShell: hold=0
#          boots straight to the desktop with no gate at all)
# scan     probe the hardware at boot and start a driver for
#          everything that answers (on/off)
# failsafe boot to NeoShell instead of the desktop (on/off).  Use
#          it to reach the machine with the compositor out of the
#          way; the `desktop` command at the prompt starts it.
#
# Malformed values keep their default, so this file can be edited
# without a tool and cannot stop the machine booting.

hold    = 3
scan    = on
failsafe = off
